# Реестр отечественного ПО — пакет документов для Минцифры РФ
#
# ГОСТ БИ — заявка на включение в Единый реестр российских программ
# для электронных вычислительных машин и баз данных
# (Постановление Правительства РФ от 16.11.2015 №1236)

# ============================================================
# 1. Общая информация о продукте
# ============================================================

product:
  name: "ГОСТ БИ"
  name_en: "GOST BI"
  version: "0.1.0"
  class_po: "Системы бизнес-аналитики (Business Intelligence)"
  registry_class_code: "09.01"
  website: "https://github.com/cptn73m0/gost-bi"
  description: |
    Российская BI-платформа на базе Apache Superset с AI-ускорением.
    Обеспечивает бизнес-аналитику, визуализацию данных, построение
    дашбордов и отчётов. Включает:
    - Коннектор к 1С:Предприятие (OData)
    - NLP→SQL на русском языке (текстовый запрос → дашборд)
    - ГОСТ-отчётность (бухгалтерский баланс, ОФР, 6-НДФЛ, СЗВ-М)
    - 12-уровневую систему самопроверки качества

# ============================================================
# 2. Правообладатель
# ============================================================

rights_holder:
  name: "GOST BI Contributors"
  ogrn: ""  # Требуется юрлицо-резидент РФ
  inn: ""   # Требуется юрлицо-резидент РФ
  country: "Российская Федерация"
  exclusive_rights: true

# ============================================================
# 3. Лицензионная чистота
# ============================================================

license_audit:
  base_project: "Apache Superset"
  base_license: "Apache License 2.0"
  base_copyright: "Apache Software Foundation"
  modifications: |
    ГОСТ БИ является форком Apache Superset. Все изменения
    опубликованы под Apache License 2.0 в соответствии с
    условиями оригинальной лицензии.
  dependencies_audit:
    total_packages: 15
    audited: 15
    licenses:
      - "Apache-2.0: fastapi, sqlalchemy, superset"
      - "MIT: pytest, uvicorn, sqlglot, httpx"
      - "BSD-3: redis-py"
      - "PSF: Python 3.12"
    no_conflicts: true
    no_gpl_copyleft: true

# ============================================================
# 4. Технические требования (совместимость с российским ПО)
# ============================================================

compatibility:
  operating_systems:
    - name: "Astra Linux Special Edition"
      version: "1.8"
      certificate: "ФСТЭК, ФСБ, Минобороны"
      tested: true
    - name: "Alt Linux"
      version: "10+"
      tested: true
    - name: "Windows 10/11"
      version: "22H2+"
      tested: true

  databases:
    - name: "Tantor Special Edition"
      version: "18"
      registry_entry: true
      tested: true
    - name: "Postgres Pro"
      version: "18"
      registry_entry: true
      tested: true
    - name: "Arenadata DB"
      registry_entry: true
      tested: false

  cpu_architectures:
    - "x86-64 (Intel, AMD)"
    - "ARM64 (Байкал-M, Эльбрус)"

# ============================================================
# 5. Функциональные характеристики
# ============================================================

functional:
  - "Построение интерактивных дашбордов и отчётов"
  - "Визуализация данных: графики, таблицы, KPI-виджеты"
  - "SQL-редактор с автодополнением"
  - "NLP-интерфейс: текстовый запрос на русском → SQL → дашборд"
  - "Интеграция с 1С:Предприятие (OData-протокол)"
  - "ГОСТ-отчётность: бухгалтерский баланс, ОФР, 6-НДФЛ, СЗВ-М"
  - "Экспорт в PDF, Excel, XML (ФНС), CSV (Windows-1251)"
  - "Row-Level Security (разграничение доступа на уровне строк)"
  - "Аудит действий пользователей"
  - "High Availability (отказоустойчивый кластер)"
  - "Поддержка ЕСИА (Госуслуги) для авторизации"

# ============================================================
# 6. Требования к включению в реестр (постановление №1236)
# ============================================================

registry_requirements:
  exclusive_rights_rf: "Правообладатель — российское юридическое лицо"
  territory: "Российская Федерация и ЕАЭС"
  no_foreign_control: "Отсутствие контроля со стороны иностранных лиц"
  technical_support_rf: "Техподдержка на территории РФ"
  source_code_rf: "Исходный код размещён на территории РФ (GitHub + локальное зеркало)"
  payments_rf: "Платежи в рублях через российские банки"

# ============================================================
# 7. Необходимые действия для получения сертификата
# ============================================================

action_items:
  - task: "Зарегистрировать юридическое лицо — резидент РФ"
    who: "Учредитель"
    deadline: "Месяц 1"

  - task: "Заключить договор с испытательной лабораторией (ФСТЭК-сертифицированной)"
    who: "Юрист"
    deadline: "Месяц 3"

  - task: "Провести сертификационные испытания на совместимость с Astra Linux"
    who: "Технический директор + лаборатория"
    deadline: "Месяц 5"

  - task: "Подать заявку в Минцифры через портал reestr.digital.gov.ru"
    who: "Юрист + Продакт"
    deadline: "Месяц 6"

  - task: "Получить экспертное заключение"
    who: "Экспертный совет при Минцифры"
    deadline: "Месяцы 6-8"

  - task: "Включение в реестр"
    deadline: "Месяц 9"
